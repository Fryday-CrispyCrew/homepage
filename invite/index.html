<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>FryDay 그룹 초대</title>
  <meta name="description" content="FryDay 그룹에 초대받았어요. 앱을 설치하고 초대 코드를 입력해보세요." />
  <meta name="theme-color" content="#ffffff" />
  <!-- 초대 링크는 검색에 걸릴 이유가 없다 -->
  <meta name="robots" content="noindex, nofollow" />

  <!-- 카카오톡·메신저 공유 미리보기 -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FryDay 그룹에 초대받았어요" />
  <meta property="og:description" content="바삭한 투두리스트 FryDay에서 함께 투두를 완성해요" />
  <meta property="og:image" content="https://app.fryday.co.kr/assets/og-invite.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="600" />
  <meta property="og:url" content="https://app.fryday.co.kr/invite/" />

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="invite">
    <!-- 인앱 브라우저에서는 앱이 열리지 않으므로 외부 브라우저로 유도한다. -->
    <div class="notice" id="inAppNotice" hidden>
      <p class="notice__text" id="inAppNoticeText"></p>
      <button class="notice__btn" type="button" id="openExternalBtn" hidden>
        외부 브라우저로 열기
      </button>
    </div>

    <img class="invite__character" src="../assets/character.png" alt="FryDay 튀김 캐릭터" width="120" height="120" />

    <!-- 링크에 그룹명이 있으면 "FryDay [그룹명] / 그룹에 초대받았어요!" 로 바뀐다 -->
    <h1 class="invite__title">
      <span class="invite__line" id="titleFirstLine">FryDay 그룹에</span>
      <span class="invite__line" id="titleSecondLine">초대받았어요!</span>
    </h1>

    <p class="invite__desc">
      친구와 함께 투두를 완성하고<br />서로의 바삭한 하루를 응원해보세요
    </p>

    <!-- 코드가 링크에 있을 때만 보여준다 -->
    <section class="code" id="codeSection" hidden aria-labelledby="codeLabel">
      <p class="code__label" id="codeLabel">그룹 코드</p>
      <p class="code__value" id="codeValue"></p>
      <button class="code__copy" type="button" id="copyBtn">코드 복사하기</button>
    </section>

    <div class="actions">
      <!-- 앱이 설치된 사람이 인앱 브라우저로 들어온 경우를 위한 수동 진입 -->
      <a class="actions__app" id="openAppBtn" href="#" hidden>앱에서 바로 열기</a>
      <p class="actions__hint" id="openAppHint" hidden>앱이 설치된 경우에만 열려요</p>

      <div class="actions__stores" id="storeButtons">
        <a class="store store--apple" id="appStoreLink"
           href="https://apps.apple.com/kr/app/fryday-%EB%B0%94%EC%82%AD%ED%95%9C-%ED%88%AC%EB%91%90-%EB%A6%AC%EC%8A%A4%ED%8A%B8/id6759564063"
           target="_blank" rel="noopener noreferrer">
          <img src="../assets/icon-apple.svg" alt="" width="18" height="23" />
          <span>App Store</span>
        </a>
        <a class="store store--google" id="playStoreLink"
           href="https://play.google.com/store/apps/details?id=com.crispycrew.fryday"
           target="_blank" rel="noopener noreferrer">
          <img src="../assets/icon-google-play.svg" alt="" width="20" height="22" />
          <span>Google Play</span>
        </a>
      </div>
    </div>

    <p class="invite__hint" id="installHint" hidden>
      앱을 설치한 뒤 이 링크를 한 번 더 눌러주세요
    </p>

    <a class="invite__home" href="../">FryDay 알아보기</a>
  </main>

  <script src="invite.js"></script>
</body>
</html>
